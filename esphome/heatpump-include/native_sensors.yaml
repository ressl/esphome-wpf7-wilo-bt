    id: laufzeit_wp1_raw
    accuracy_decimals: 0
    icon: "mdi:timer-outline"
    entity_category: diagnostic

  # ========================================================================
  # WPM i DECODED SENSORS (2.9.0, ComfortSoft 4.2.0 & 2026-11-16 CAN scan)
  # ========================================================================
  - platform: template
    name: "Hochdruck Kältekreis"
    id: hochdruck_kaeltekreis
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:gauge"

  - platform: template
    name: "Kondensationstemperatur (R410A)"
    id: kondensationstemp_r410a
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:thermometer-lines"
    entity_category: diagnostic

  - platform: template
    name: "Verflüssiger-Grädigkeit"
    id: verfluessiger_graedigkeit
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:delta"
    entity_category: diagnostic

  - platform: template
