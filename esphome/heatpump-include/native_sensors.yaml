    id: heizkurve_wert
    state_class: measurement
    accuracy_decimals: 2
    icon: "mdi:chart-bell-curve-cumulative"

  - platform: template
    name: "Vorlauf Solltemperatur"
    id: vorlauf_solltemp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:thermometer-auto"

  # ========================================================================
  # HEATING CIRCUIT - WORKING ✅
  # ========================================================================
  # 2.5.0: the room temperature read-back sensors of 2.4.0 were removed with the feed

  # "Vorlauf Solltemperatur" removed in 2.3.0: VORLAUFSOLLTEMP answers -255 and is not polled

  # ========================================================================
  # BUFFER/STORAGE - WORKING ✅
  # ========================================================================
  - platform: template
