  # BUFFER TANK SETPOINTS (from MANAGER 0x480) - WORKING ✅
  # Read-only display sensors (actual setpoint control via number entities)
  # ========================================================================
  - platform: template
    name: "Puffer Solltemperatur (Anzeige)"
    id: einstell_speichersolltemp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
