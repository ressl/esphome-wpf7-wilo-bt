select:
  # Operating mode of the WPM i (PROGRAMMSCHALTER). Options = BetriebsartList
  # (WPM2 naming). The select shows the mode read from the WPM i.
  - platform: template
    name: "Betriebsmodus Auswahl"
    id: betriebsmodus_select
    icon: "mdi:state-machine"
    options:
      - "Automatik"
      - "Tagbetrieb"
      - "Absenkbetrieb"
      - "Bereitschaft"
      - "Warmwasser"
      - "Notbetrieb"
    update_interval: 5s
    lambda: |-
      if (hscLastProgrammschalter.empty()) return {};
      return hscLastProgrammschalter;
    set_action:
      - lambda: |-
          if (x == "Notbetrieb") {
            ESP_LOGW("MODE", "Notbetrieb cannot be set from Home Assistant (electric heater only)");
            return;
          }
          if (x == hscLastProgrammschalter) return;   // WPM i already in this mode
          writeSignal(&CanMembers[cm_manager], "PROGRAMMSCHALTER", x.c_str());
          delay(100);
          readSignal(&CanMembers[cm_manager], "PROGRAMMSCHALTER");
