#########################################
#                                       #
#   WRITABLE CONTROLS - WORKING ✅      #
#                                       #
#########################################
number:
  # Writable setpoints with direct CAN bus control (ressl 2.3.0: the numbers
  # show the value read back from the WPM i; nothing is written at boot).
  # NOTE: EINSTELL_SPEICHERSOLLTEMP(2) is the DHW setpoint of the WPM i. The WPF 7
  # has no DHW tank, so "Puffer Sollwert" has no effect on heating. The actual
  # buffer target is "Puffersolltemperatur" (heating curve). Names kept for the
  # existing entity IDs.
  - platform: template
    name: "Puffer Sollwert"
    id: speichersolltemp_setpoint
    min_value: 10
    max_value: 65
    step: 1
    unit_of_measurement: "°C"
    device_class: temperature
    mode: box
    icon: "mdi:storage-tank"
    update_interval: 10s
    lambda: |-
      float v = id(einstell_speichersolltemp).state;
      if (std::isnan(v) || v < 10 || v > 65) return {};
      return v;
    set_action:
      - lambda: |-
          float cur = id(einstell_speichersolltemp).state;
          if (!std::isnan(cur) && fabsf(cur - x) < 0.05f) return;   // WPM i already has it
          char valueStr[16];
          snprintf(valueStr, sizeof(valueStr), "%.1f", x);
          writeSignal(&CanMembers[cm_manager], "EINSTELL_SPEICHERSOLLTEMP", valueStr);
          delay(100);
          readSignal(&CanMembers[cm_manager], "EINSTELL_SPEICHERSOLLTEMP");

  - platform: template
    name: "Puffer Sollwert 2"
    id: speichersolltemp2_setpoint
    min_value: 10
    max_value: 65
    step: 1
    unit_of_measurement: "°C"
    device_class: temperature
    mode: box
    icon: "mdi:storage-tank-outline"
    update_interval: 10s
    lambda: |-
