  - platform: template
    name: "Geschätzter COP"
    id: estimated_cop
    unit_of_measurement: ""
    state_class: measurement
    accuracy_decimals: 2
    icon: "mdi:gauge"
    # System COP = thermal power / Shelly total active power (only when compressor running)

  - platform: template
