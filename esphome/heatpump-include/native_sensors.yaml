#
# Native ESPHome Sensors for WPF 7 Heat Pump
# These sensors appear directly in Home Assistant via ESPHome API
# MQTT remains as optional secondary channel
# Based on live MQTT data: 2026-02-10 01:31
# All signal names verified to exist in ElsterTable.h and to return valid values
#
# ressl 2.3.0 (2026-11-16):
#  - removed entities that never received a value: "Vorlauf Solltemperatur",
#    "Initialisierung", "Betriebsart"
#  - setpoint numbers and the mode select mirror the values read from the WPM i
#    (lambda) instead of optimistic/restored values; writes are skipped when the
#    WPM i already has the requested value
#  - mode select offers the modes the WPM i really knows ("Heizen"/"Aus" did not
#    exist and were refused); Notbetrieb is shown but cannot be set
#  - EVU Sperre: device_class lock removed (on = Sperre aktiv was shown as "unlocked")
#  - Firmware Version shows the project version instead of a hard-coded "v0.15"
#

#########################################
#                                       #
#   TEMPERATURE SENSORS                 #
#                                       #
#########################################
sensor:
  # ========================================================================
  # ACTUAL TEMPERATURES (from KESSEL 0x180) - WORKING ✅
  # ========================================================================
  - platform: template
    name: "Außentemperatur"
    id: aussentemp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:thermometer"
    
  - platform: template
    name: "Rücklauf Ist-Temperatur"
    id: ruecklaufisttemp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:thermometer-chevron-down"
    
  - platform: template
    name: "WP Vorlauf Ist"
    id: wpvorlaufist
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:thermometer-chevron-up"
    
  # SAMMLERISTTEMP removed — no solar thermal connected

  # ========================================================================
  # SOLE/WASSER SPECIFIC (WPF 7) - WORKING ✅
  # ========================================================================
  - platform: template
    name: "Quellen-Solltemperatur (Sole)"
    id: quellensolltemperatur
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:water-thermometer-outline"
    
  - platform: template
    name: "Heißgas-Temperatur"
