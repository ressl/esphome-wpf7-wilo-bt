    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:fire"

  # ========================================================================
  # DIAGNOSTICS (ressl 2.5.0) - read-only, raw values from the CAN scan of
  # 2026-11-16. Meaning still to be validated during a compressor run, see
  # signal_requests_wpf7.h (index meaning after chriss1980, WPMiw).
  # ========================================================================
  - platform: template
    name: "Quellen-Isttemperatur (Sole)"
    id: quelle_ist
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:water-thermometer"
    entity_category: diagnostic

  - platform: template
    name: "Maschinendruck (roh)"
    id: maschinendruck_raw
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:gauge"
    entity_category: diagnostic

  - platform: template
    name: "Relaisstatus (roh)"
    id: relaisstatus_raw
    accuracy_decimals: 0
    icon: "mdi:electric-switch"
    entity_category: diagnostic

  - platform: template
    name: "Zweiter WE Status (roh)"
    id: zweiter_we_status_raw
    accuracy_decimals: 0
    icon: "mdi:heating-coil"
    entity_category: diagnostic

  - platform: template
