#
# Passive CAN bus monitor (ressl fork 2.4.1). Logic: ha-stiebel-control/bus_monitor.h
#
# Sends nothing. While the switch is on (it turns itself off after 2 h, and is always
# off after a reboot), every frame that is not the answer to one of our own reads is
# counted per (sender, type, receiver, index). The first 3 frames of every kind are
# logged with tag BUSMON (MQTT heatingpump/debug); every kind is kept retained in
# MQTT heatingpump/busmon/<from>/<type>/<to>/<index>. Purpose: find out whether and
# how the WPM i looks for a remote control (FEK).
#
switch:
  - platform: template
    name: "CAN-Busmonitor (nur lesen)"
    id: bus_monitor_switch
    icon: "mdi:monitor-eye"
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: busMonStart();
    on_turn_off:
      - lambda: busMonStop("ausgeschaltet");

text_sensor:
  - platform: template
    name: "CAN-Busmonitor Status"
    id: bus_monitor_status
    icon: "mdi:monitor-eye"
    entity_category: diagnostic

interval:
  - interval: 5s
    then:
      - lambda: busMonTick();
